name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

jobs:
  # Run tests first
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
          echo "✅ All tests passed"

  # Build job for main pushes (validation only)
  build-validation:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build Docker image for validation
        run: |
          docker build -t c24-document-downloader:validation .
          echo "✅ Build validation successful"

  # Build and deploy job for releases
  build-and-deploy:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Get release version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: c24-document-downloader
          IMAGE_TAG: ${{ steps.version.outputs.version }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "✅ Pushed image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "✅ Pushed image: $ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Update homelab-iac repository
        env:
          GITHUB_TOKEN: ${{ secrets.HOMELAB_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Clone homelab-iac repository
          git clone https://x-access-token:$GITHUB_TOKEN@github.com/JonasHess/homelab-iac.git
          cd homelab-iac

          # Create new branch for this version
          BRANCH_NAME="update-c24-document-downloader-$VERSION"
          git checkout -b $BRANCH_NAME

          # Update the image tag in values.yaml. The image is a single
          # ``<registry>/c24-document-downloader:<tag>`` string under
          # generic.deployment.image — sed targets only the tag portion.
          sed -i "s|/c24-document-downloader:[^[:space:]]*|/c24-document-downloader:$VERSION|" apps/c24-document-downloader/values.yaml

          # No-op guard: if the chart already pointed at this version (e.g.
          # the chart was committed with the matching tag pre-release), skip
          # the PR step cleanly instead of failing the whole workflow.
          if git diff --quiet apps/c24-document-downloader/values.yaml; then
            echo "✓ homelab-iac already at $VERSION — no PR needed"
            exit 0
          fi

          # Commit the change
          git config user.name "c24-document-downloader-bot"
          git config user.email "noreply@github.com"
          git add apps/c24-document-downloader/values.yaml
          git commit -m "chore: Update c24-document-downloader to $VERSION

          🚀 Automated update from c24-document-downloader release

          - Image: $ECR_REGISTRY/c24-document-downloader:$VERSION
          - Release: https://github.com/zimmermq/c24-document-downloader/releases/tag/$VERSION"

          # Push the branch
          git push origin $BRANCH_NAME

          # Create pull request
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/JonasHess/homelab-iac/pulls \
            -d "{
              \"title\": \"🚀 Update c24-document-downloader to $VERSION\",
              \"head\": \"$BRANCH_NAME\",
              \"base\": \"main\",
              \"body\": \"## 🚀 Automated Update\\n\\nThis PR updates the c24-document-downloader container image to version **$VERSION**.\\n\\n### Changes\\n- Updated \`apps/c24-document-downloader/values.yaml\` with new image tag\\n- Image: \`$ECR_REGISTRY/c24-document-downloader:$VERSION\`\\n\\n### Release Information\\n- Release: https://github.com/zimmermq/c24-document-downloader/releases/tag/$VERSION\\n\\n---\\n*This PR was automatically created by the c24-document-downloader release workflow.*\"
            }"
